# PrusaSlicer 2.9 settings for "any Creality" (model unknown), PLA, 0.4 mm nozzle.
# Only plain G-code that both Marlin (Ender-3 family) and Klipper (K1 / K2 / Ender-3 V3 KE) accept;
# 220 x 220 bed (the smallest of them), part centred at 110,110; conservative speeds and accelerations.
# Retraction is a compromise between Bowden (Ender-3/Pro/V2) and direct drive (S1, V3, K1, K2);
# this part barely needs it (travel stays inside the block).

# --- printer
printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
gcode_flavor = marlin2
use_relative_e_distances = 0
machine_limits_usage = time_estimate_only
retract_length = 1
retract_speed = 35
retract_restart_extra = 0
retract_before_travel = 2
retract_layer_change = 0
retract_lift = 0
only_retract_when_crossing_perimeters = 1
wipe = 0
start_gcode = ; any Creality: plain Marlin/Klipper G-code\nG90\nM82\nM140 S[first_layer_bed_temperature]\nM104 S150 ; warm the nozzle without oozing while homing\nG28\nM420 S1 ; use the saved bed mesh if the printer has one (harmlessly ignored otherwise)\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0\nG1 Z2.0 F3000\nG1 X2 Y20 Z0.28 F5000\nG1 X2 Y150 Z0.28 F1500 E10 ; purge line along the left edge\nG1 X2.4 Y150 Z0.28 F5000\nG1 X2.4 Y20 Z0.28 F1500 E20\nG92 E0\nG1 Z2.0 F3000
end_gcode = M104 S0\nM140 S0\nG91\nG1 E-2 F2700\nG1 Z10 F600\nG90\nG1 X0 Y200 F3000 ; present the print\nM106 S0\nM84 X Y E
layer_gcode =
before_layer_gcode =

# --- print
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 20%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
seam_position = rear
external_perimeter_speed = 25
perimeter_speed = 40
small_perimeter_speed = 20
infill_speed = 60
solid_infill_speed = 50
top_solid_infill_speed = 30
gap_fill_speed = 25
bridge_speed = 30
first_layer_speed = 20
travel_speed = 120
default_acceleration = 1000
perimeter_acceleration = 800
external_perimeter_acceleration = 600
infill_acceleration = 1500
solid_infill_acceleration = 1200
top_solid_infill_acceleration = 800
first_layer_acceleration = 500
travel_acceleration = 1500
bridge_acceleration = 800
skirts = 1
skirt_distance = 4
skirt_height = 1
brim_width = 0
support_material = 0
elefant_foot_compensation = 0.2
xy_size_compensation = 0
slice_closing_radius = 0.049
avoid_crossing_perimeters = 0
gcode_comments = 0
gcode_label_objects = octoprint

# --- filament (PLA, 1.75 mm)
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
extrusion_multiplier = 1
first_layer_temperature = 210
temperature = 205
first_layer_bed_temperature = 60
bed_temperature = 60
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
full_fan_speed_layer = 3
slowdown_below_layer_time = 5
min_print_speed = 10
filament_max_volumetric_speed = 12
